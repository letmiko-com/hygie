<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Écran Hygie" description="Écran de données Hygie : sidebar, navigation temporelle, cartes de métriques avec tendance, panneau de chart" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="display:flex;min-height:100vh;background:var(--bg);font-family:var(--font-ui);color:var(--text-1);font-size:13px">
<x-import component-from-global-scope="Hygie_70a315.Sidebar" items="{{navItems}}" active="dash" user="{{user}}" sync-status="fresh" sync-detail="Sync il y a 4 min" hint-size="212px,100vh"></x-import>
<main style="flex:1;min-width:0;padding:16px 22px 48px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
<h1 style="margin:0;font:600 20px/1.2 var(--font-ui)">Titre de l'écran</h1>
<x-import component-from-global-scope="Hygie_70a315.TimeNav" preset="1m" range-label="1 – 31 juil. 2026" compare-label="vs juil. 2025" style="margin-left:auto" hint-size="640px,32px"></x-import>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">
<x-import component-from-global-scope="Hygie_70a315.MetricCard" icon="favorite" label="FC repos" value="52" unit="bpm" delta="{{deltaFc}}" invert="{{ true }}" data="{{sparkFc}}" color="var(--data-heart)" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="Hygie_70a315.MetricCard" icon="local_fire_department" label="Énergie active / j" value="612" unit="kcal" delta="{{deltaEnergy}}" data="{{sparkEnergy}}" color="var(--data-energy)" hint-size="100%,124px"></x-import>
<x-import component-from-global-scope="Hygie_70a315.MetricCard" icon="bedtime" label="Sommeil moyen" value="7 h 24" delta="{{deltaSleep}}" data="{{sparkSleep}}" color="var(--data-sleep)" hint-size="100%,124px"></x-import>
</div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px">
<div style="font:500 11px/1.2 var(--font-ui);letter-spacing:0.05em;text-transform:uppercase;color:var(--text-3);margin-bottom:12px">Titre du chart — moyenne glissante 7 j</div>
<x-import component-from-global-scope="Hygie_70a315.LineChart" series="{{series}}" height="{{chartHeight}}" x-labels="{{xLabels}}" hint-size="100%,230px"></x-import>
</div>
<div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:110px">
<p style="margin:0;font:400 13px/1.5 var(--font-ui);color:var(--text-3)">Zone libre — remplacez ce panneau par vos listes de séances, tableaux ou charts. Règles Hygie : chiffres tabulaires, tendance sur chaque valeur, « pas de donnée » ≠ 0.</p>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const R=(i,s)=>{const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x);};
    const wave=(n,b,a,f,s)=>Array.from({length:n},(_,i)=>+(b+a*Math.sin(i/f+s)+(R(i,s)-0.5)*a*0.5).toFixed(1));
    return {
      navItems:[{id:'dash',icon:'monitoring',label:'Dashboard'},{id:'sport',icon:'exercise',label:'Sport'},{id:'records',icon:'trophy',label:'Records'},{id:'sleep',icon:'bedtime',label:'Sommeil'},{section:'Instance'},{id:'sync',icon:'sync',label:'Synchronisation'},{id:'account',icon:'settings',label:'Réglages'}],
      user:{name:'Anna Martin',email:'anna@exemple.fr'},
      sparkFc:wave(30,54,2,4,1),deltaFc:-3.8,
      sparkEnergy:wave(30,560,60,4,3),deltaEnergy:8.2,
      sparkSleep:wave(30,7.3,0.5,6,5),deltaSleep:-1.2,
      series:[{data:wave(31,142,10,5,2),color:'var(--data-heart)',label:'Cette période',avg:7},{data:wave(31,147,9,6,9),color:'var(--data-heart)',label:'Période comparée',dashed:true}],
      xLabels:['1 juil','8','15','22','31 juil'],
      chartHeight:180
    };
  }
}
</script>
</body>
</html>
