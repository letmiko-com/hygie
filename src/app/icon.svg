<!-- Hygie mark (three bars, see components/ui/Logo.tsx). Without this file
     the browser asked for /favicon.ico on every visit and got a 404. Colors
     are literal: a favicon is rendered outside the page, so CSS tokens and
     prefers-color-scheme do not apply. The light accent of the dark theme
     reads on both browser-tab backgrounds. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#0f1417" />
  <g fill="#5ec8bd">
    <rect x="4" y="13" width="6" height="15" rx="3" />
    <rect x="13" y="4" width="6" height="24" rx="3" />
    <rect x="22" y="9" width="6" height="12" rx="3" />
  </g>
</svg>
